name: Publish GHCR

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/nilo-datalake" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Org-owned GHCR packages often cannot be switched to public via API (403/404).
      # One-time UI: org Packages → nilo-datalake → Change visibility → Public.
      - name: Make GHCR package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pkg="nilo-datalake"
          owner="${{ github.repository_owner }}"
          if gh api --method PATCH "/orgs/${owner}/packages/container/${pkg}" \
              -f visibility=public 2>/tmp/ghcr-vis.err; then
            echo "Package visibility set to public."
          else
            cat /tmp/ghcr-vis.err >&2 || true
            echo "::warning::Could not set GHCR visibility from CI. Org admin: https://github.com/orgs/${owner}/packages/container/package/${pkg}/settings → Change visibility → Public. Until then, set GitHub user/token in ./configure.sh (8–9) on the VM."
          fi

      - name: Upload VM deploy bundle
        uses: actions/upload-artifact@v4
        with:
          name: nilo-datalake-vm-ghcr-deploy
          path: deploy/vm-ghcr/
          if-no-files-found: error
